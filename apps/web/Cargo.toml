[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Optimize for size: SBF binary bytes are rent (~6,960 lamports/byte on
# ProgramData) — "z" trades marginal compute for a smaller deploy footprint.
# overflow-checks stays ON regardless (money math).
opt-level = "z"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Strip host-side debuginfo from the dev profile to shrink target/debug (the IDL
# build's host compile). Does not affect the SBF .so or correctness.
[profile.dev]
debug = false

# curve25519-dalek 4.1.3 conflicts with zeroize ^1.7 under the anchor 0.31.1 /
# Agave 3.1.12 toolchain on this machine. The anza fork (branch 3.2.1-unpin-zeroize)
# unpins zeroize and resolves the conflict. (agent-vault + vello-escrow recipe.)
[patch.crates-io]
curve25519-dalek = { git = "https://github.com/anza-xyz/curve25519-dalek.git", rev = "b500cdc2a920cd5bff9e2dd974d7b97349d61464" }

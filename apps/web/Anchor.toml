[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
agent_vault = "93RLwdPcyuNFFougLvRLe7912oJBfq77Y8ZNYXQZD6CP"
vello_escrow = "Gztj63kcdst6YrdyCGPoWAgLqDGJZAG43UQqtDY8HVxx"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/*"]

[scripts]
test = "npx ts-mocha -p ./tests/tsconfig.json -t 1000000 tests/vello-escrow.ts tests/agent-vault.ts"

# Genesis-load the escrow as an UPGRADEABLE program with the provider wallet as
# upgrade authority. Without this, `anchor test` loads workspace programs with no
# upgrade authority, so the init_platform_config upgrade-authority gate (#1) can
# never be satisfied on localnet and every config-dependent test cascades.
[[test.genesis]]
address = "Gztj63kcdst6YrdyCGPoWAgLqDGJZAG43UQqtDY8HVxx"
program = "target/deploy/vello_escrow.so"
upgradeable = true
